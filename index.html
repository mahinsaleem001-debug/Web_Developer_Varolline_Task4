<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazaarly | Everyday things, beautifully chosen</title>
  <meta name="description" content="Bazaarly is a responsive online store demo with search, category filters, price sorting, product pages and a shopping cart that is saved after refresh.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 26h28l-3 20H21z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M25 26a7 7 0 0 1 14 0' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Set the theme before the page paints, so there is no light/dark flash.
    try {
      var t = localStorage.getItem('bazaarly-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2L5 8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 8V7a3.5 3.5 0 0 1 7 0v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="17.5" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="17.5" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-return" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10H8M4 9l4-4M4 9l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.500-7-10V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2.200 2.200L15 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" aria-label="Bazaarly home">
        <span class="brand-mark" aria-hidden="true"><svg class="ico"><use href="#i-bag"/></svg></span>
        <span class="brand-name">Bazaarly</span>
      </a>

      <form class="search" role="search" id="search-form" autocomplete="off">
        <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="sr-only" for="search">Search products</label>
        <input id="search" type="search" placeholder="Search products…  ( press / )" maxlength="80">
      </form>

      <div class="actions">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to dark theme">
          <svg class="ico"><use href="#i-moon"/></svg>
        </button>
        <a class="cart-btn" id="cart-link" href="#/cart" aria-label="Cart, 0 items">
          <svg class="ico" aria-hidden="true"><use href="#i-bag"/></svg>
          <span class="cart-label">Cart</span>
          <span class="badge" id="cart-badge" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer-in">
      <p><strong>Bazaarly</strong> is a demo store built for the Varolline Web Developer internship (Task 4). No real payments are taken.</p>
      <p class="muted">HTML · CSS · Vanilla JavaScript · products loaded from <code>data/products.json</code></p>
    </div>
  </footer>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>
  <div class="sr-only" id="sr-live" role="status" aria-live="polite"></div>

  <dialog id="checkout-dialog" class="dialog" aria-labelledby="dlg-title"></dialog>

  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
